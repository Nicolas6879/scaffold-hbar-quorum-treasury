name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: corepack enable
      - run: yarn install --immutable
      - name: Lint (Next.js, Solidity format, treasury types)
        run: yarn lint
      - run: yarn next:check-types
      - name: Unit, fuzz and invariant tests
        run: yarn test
      - name: Contract fork test against Hedera testnet (SaucerSwap + Chainlink)
        working-directory: packages/foundry
        run: FORK=1 forge test --match-contract SwapGuardForkTest --fork-url https://testnet.hashio.io/api
        continue-on-error: true
      - run: yarn next:build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  proofs:
    # Re-checks every testnet claim in docs/proofs.json against the public mirror node (no keys needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn verify:proofs
